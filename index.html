<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>receipt-desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <span class="logo">
      receipt-desk
      <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="3" rx="1" fill="currentColor" stroke="none"/>
        <line x1="5" y1="9" x2="5" y2="19"/>
        <line x1="19" y1="9" x2="19" y2="19"/>
      </svg>
    </span>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">ログイン</button>
      <button class="auth-tab" data-tab="signup">新規登録</button>
    </div>

    <form id="auth-form">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="password" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="auth-btn">ログイン</button>
    </form>

    <p id="auth-error" class="error-msg hidden"></p>

    <p id="plan-info" class="plan-info hidden">
      現在は無料プランのみで提供しています。OCR自動読み取りは月30件まで利用でき、上限に達した場合は翌月にリセットされます。上限拡張などの有料プランは準備中です。
    </p>

    <p class="privacy-notice">
      個人が開発・運営しているサービスです。レシート画像はAI企業のAnthropic社に送信され、日付・店名・金額などを自動で読み取ります。保存データは日本国内のサーバーで管理し、アカウント削除でレシート・画像を含め全データを完全に削除できます。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
