<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>receipt-desk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <span class="logo">receipt-desk</span>
    <p class="tagline">レシート証憑管理</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">ログイン</button>
      <button class="auth-tab" data-tab="signup">新規登録</button>
    </div>

    <form id="auth-form">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="password" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="auth-btn">ログイン</button>
    </form>

    <p id="auth-error" class="error-msg hidden"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
