<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>receipt-desk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <span class="logo">receipt-desk</span>
    <button id="logout-btn" class="btn-ghost">ログアウト</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="add">追加</button>
    <button class="tab" data-tab="list">一覧</button>
  </nav>

  <!-- 追加タブ -->
  <section id="tab-add" class="tab-content">
    <div class="upload-area" id="image-upload-area">
      <input type="file" id="image-input" accept="image/*" capture="environment">
      <div class="upload-placeholder" id="upload-placeholder">
        <span class="upload-icon">📷</span>
        <p>タップして撮影 / 写真を選択</p>
      </div>
      <img id="image-preview" class="hidden" alt="プレビュー">
    </div>

    <form id="receipt-form" class="receipt-form">
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="receipt-date" required>
      </div>
      <div class="form-group">
        <label>店名・取引先</label>
        <input type="text" id="store-name" placeholder="例：スターバックス">
      </div>
      <div class="form-group">
        <label>金額（円）</label>
        <input type="number" id="amount" placeholder="例：1500" min="0">
      </div>
      <div class="form-group">
        <label>適格請求書（インボイス）</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="is_qualified" value="true" checked> 適格
          </label>
          <label class="radio-label">
            <input type="radio" name="is_qualified" value="false"> 非適格
          </label>
        </div>
      </div>
      <div class="form-group">
        <label>消費税率</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="tax_rate" value="10" checked> 10%
          </label>
          <label class="radio-label">
            <input type="radio" name="tax_rate" value="8"> 8%（軽減税率）
          </label>
        </div>
      </div>
      <div class="form-group">
        <label>勘定科目</label>
        <select id="category">
          <option value="">未選択</option>
          <option value="会議費">会議費</option>
          <option value="交通費">交通費</option>
          <option value="消耗品費">消耗品費</option>
          <option value="通信費">通信費</option>
          <option value="接待交際費">接待交際費</option>
          <option value="研修費">研修費</option>
          <option value="広告宣伝費">広告宣伝費</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>メモ</label>
        <input type="text" id="memo" placeholder="任意">
      </div>
      <button type="submit" class="btn-primary">保存する</button>
    </form>
  </section>

  <!-- 一覧タブ -->
  <section id="tab-list" class="tab-content hidden">
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="店名・メモで検索">
      <button id="export-csv-btn" class="btn-ghost">⬇ CSV</button>
    </div>
    <div id="receipt-list"></div>
    <p id="empty-state" class="empty-state hidden">レシートがありません</p>
  </section>

  <!-- 詳細モーダル -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <button id="modal-close" class="btn-ghost">✕ 閉じる</button>
        <div class="modal-actions">
          <button id="download-btn" class="btn-ghost">⬇ 保存</button>
          <button id="delete-btn" class="btn-danger">削除</button>
        </div>
      </div>

      <div id="modal-image-container">
        <img id="modal-image" src="" alt="レシート">
      </div>

      <form id="modal-form" class="receipt-form">
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="modal-date">
        </div>
        <div class="form-group">
          <label>店名・取引先</label>
          <input type="text" id="modal-store">
        </div>
        <div class="form-group">
          <label>金額（円）</label>
          <input type="number" id="modal-amount" min="0">
        </div>
        <div class="form-group">
          <label>適格請求書（インボイス）</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="modal_qualified" value="true"> 適格
            </label>
            <label class="radio-label">
              <input type="radio" name="modal_qualified" value="false"> 非適格
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消費税率</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="modal_tax_rate" value="10"> 10%
            </label>
            <label class="radio-label">
              <input type="radio" name="modal_tax_rate" value="8"> 8%（軽減税率）
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>勘定科目</label>
          <select id="modal-category">
            <option value="">未選択</option>
            <option value="会議費">会議費</option>
            <option value="交通費">交通費</option>
            <option value="消耗品費">消耗品費</option>
            <option value="通信費">通信費</option>
            <option value="接待交際費">接待交際費</option>
            <option value="研修費">研修費</option>
            <option value="広告宣伝費">広告宣伝費</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>メモ</label>
          <input type="text" id="modal-memo">
        </div>
        <button type="submit" class="btn-primary">更新する</button>
      </form>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/compress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
