<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>receipt-desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1+Code:wght@400;700&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/desk.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="desk-app desk-mode">

  <header>
    <span class="logo">
      receipt-desk
      <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="3" rx="1" fill="currentColor" stroke="none"/>
        <line x1="5" y1="9" x2="5" y2="19"/>
        <line x1="19" y1="9" x2="19" y2="19"/>
      </svg>
    </span>
    <div class="header-actions">
      <button id="account-btn" class="btn-ghost account-btn" aria-label="アカウント">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </button>
      <div id="account-menu" class="account-menu hidden">
        <div class="account-usage">
          <p id="account-plan-label"></p>
          <p id="account-usage-label"></p>
        </div>
        <button id="logout-btn" class="btn-ghost">ログアウト</button>
        <button id="delete-account-btn" class="btn-danger">退会</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="add">追加</button>
    <button class="tab" data-tab="list">一覧</button>
  </nav>

  <!-- 追加タブ -->
  <section id="tab-add" class="tab-content">
    <input type="file" id="image-input" class="desk-visually-hidden" accept="image/*" multiple aria-label="レシート画像を撮影または選択" tabindex="-1">

    <!-- 何もない状態：机の上に追加の枠と小物 -->
    <div id="add-empty" class="desk-empty">
      <div class="desk-decor desk-ring" aria-hidden="true"></div>
      <div class="desk-decor desk-pencil" aria-hidden="true"><div class="desk-pencil-tip"></div><div class="desk-pencil-body"></div><div class="desk-pencil-end"></div></div>
      <svg class="desk-decor desk-clip" width="16" height="46" viewBox="0 0 16 46" fill="none" aria-hidden="true"><path d="M5 30V8a3.5 3.5 0 0 1 7 0v26a5.5 5.5 0 0 1-11 0V12" stroke="#a7afb6" stroke-width="2" stroke-linecap="round"/></svg>

      <div class="desk-minis" aria-hidden="true">
        <div class="desk-mini-wrap" style="left: 18px; top: 6px; transform: rotate(-10deg)"><div class="desk-mini"></div></div>
        <div class="desk-mini-wrap" style="left: 72px; top: 0; transform: rotate(7deg)"><div class="desk-mini"></div></div>
      </div>
      <h2>レシートを机に広げる</h2>
      <label for="image-input" class="desk-btn desk-btn-stamp" role="button" tabindex="0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        撮影・写真を選ぶ
      </label>
      <p class="desk-empty-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        写真の選択、読み取りはまとめて可能
      </p>
    </div>

    <!-- レシートがある状態：追加の細い枠 -->
    <label for="image-input" id="add-slip" class="desk-slip hidden" role="button" tabindex="0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      レシートを撮る・選ぶ
    </label>

    <!-- 2件以上選んだときの一括記入 -->
    <section id="bulk-apply-row" class="desk-pad hidden" aria-label="一括記入">
      <p class="desk-pad-title">選んだ<b id="bulk-count">0</b>件にまとめて記入</p>
      <div class="desk-pad-row">
        <div class="desk-pad-f">
          <label for="bulk-apply-field">項目</label>
          <select id="bulk-apply-field" class="desk-pad-sel">
            <option value="">項目を選択</option>
            <option value="store_name">店名・取引先</option>
            <option value="category">勘定科目</option>
            <option value="payment_method">取引手段</option>
            <option value="memo">摘要</option>
          </select>
        </div>
        <div class="desk-pad-f hidden" id="bulk-value-wrap">
          <label for="bulk-apply-value-select" id="bulk-value-label">記入する値</label>
          <select id="bulk-apply-value-select" class="desk-pad-sel hidden"></select>
          <input type="text" id="bulk-apply-value-text" class="desk-pad-sel hidden" placeholder="空欄で反映も可">
        </div>
        <button type="button" id="bulk-apply-btn" class="desk-btn desk-btn-ink hidden">反映</button>
      </div>
    </section>

    <div id="add-list"></div>

    <!-- 下部の操作バー -->
    <div id="add-toolbar" class="hidden">
      <div class="add-toolbar-row">
        <span id="add-count-label"></span>
        <button type="button" id="add-ocr-btn" class="desk-btn desk-btn-paper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          読み取る
        </button>
        <button type="button" id="add-save-btn" class="desk-btn desk-btn-stamp hidden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          保存
        </button>
      </div>
    </div>
  </section>

  <!-- 一覧タブ（机の上の帳簿） -->
  <section id="tab-list" class="tab-content hidden">
    <label class="desk-find">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="desk-visually-hidden">検索</span>
      <input type="search" id="search-input" placeholder="店名・摘要で探す">
    </label>

    <section id="receipt-list" class="desk-ledger hidden" aria-label="保存したレシート"></section>
    <p id="empty-state" class="desk-ledger-empty hidden">レシートがありません</p>

    <!-- 下部の書き出しバー -->
    <div id="list-toolbar">
      <div id="csv-range-custom" class="list-toolbar-range hidden">
        <input type="date" id="csv-range-start" class="desk-pad-sel" aria-label="開始日">
        <span aria-hidden="true">〜</span>
        <input type="date" id="csv-range-end" class="desk-pad-sel" aria-label="終了日">
      </div>
      <div class="list-toolbar-row">
        <div class="desk-per">
          <label for="csv-range-select">書き出す期間</label>
          <select id="csv-range-select" class="desk-pad-sel">
            <option value="all">すべての期間</option>
            <option value="month">今月</option>
            <option value="quarter">今四半期</option>
            <option value="year">今年</option>
            <option value="custom">期間を指定</option>
          </select>
        </div>
        <button type="button" id="export-images-btn" class="desk-btn desk-btn-paper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          画像ZIP
        </button>
        <div class="csv-export">
          <button type="button" id="csv-export-toggle" class="desk-btn desk-btn-stamp" aria-haspopup="true" aria-expanded="false" aria-controls="csv-export-menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>
            CSV
            <svg class="desk-csv-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
          </button>
          <div id="csv-export-menu" class="desk-csv-menu hidden">
            <button type="button" id="export-csv-btn">汎用形式</button>
            <button type="button" id="export-csv-yayoi-btn">弥生形式<small>やよいの青色申告 オンライン</small></button>
          </div>
        </div>
      </div>
      <p id="image-export-progress" class="hidden" role="status"></p>
    </div>
  </section>

  <!-- 画像プレビュー -->
  <div id="image-lightbox" class="image-lightbox hidden">
    <img id="lightbox-image" src="" alt="レシート拡大画像">
  </div>

  <!-- 詳細モーダル（机の上に写真とカードを置く） -->
  <div id="modal-overlay" class="desk-modal hidden" role="dialog" aria-modal="true" aria-label="レシートの詳細">
    <button type="button" id="modal-close" class="desk-modal-close">
      閉じる
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="modal" class="desk-modal-inner">
      <form id="modal-form" class="desk-modal-card">
        <svg class="desk-modal-clip" width="18" height="52" viewBox="0 0 16 46" fill="none" aria-hidden="true"><path d="M5 30V8a3.5 3.5 0 0 1 7 0v26a5.5 5.5 0 0 1-11 0V12" stroke="#a7afb6" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="desk-f desk-f-date">
          <label for="modal-date">日付</label>
          <input type="date" id="modal-date">
          <button type="button" id="modal-photo-toggle" class="desk-photo-toggle" aria-expanded="false" aria-controls="modal-image-container">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            写真
          </button>
        </div>
        <div class="desk-f">
          <label for="modal-store">店名</label>
          <input type="text" id="modal-store" placeholder="店名・取引先">
        </div>
        <div class="desk-f">
          <label for="modal-amount">金額</label>
          <div class="desk-f-amt"><span aria-hidden="true">¥</span><input type="number" id="modal-amount" min="0" inputmode="numeric" placeholder="0"></div>
        </div>
        <div class="desk-f">
          <label for="modal-category">勘定科目</label>
          <div class="desk-f-sel">
            <select id="modal-category">
              <option value="">未選択</option>
              <option value="会議費">会議費</option>
              <option value="交通費">交通費</option>
              <option value="消耗品費">消耗品費</option>
              <option value="通信費">通信費</option>
              <option value="接待交際費">接待交際費</option>
              <option value="研修費">研修費</option>
              <option value="広告宣伝費">広告宣伝費</option>
              <option value="その他">その他</option>
            </select>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="desk-radio-row">
          <span>インボイス</span>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="modal_qualified" value="true"> 適格</label>
            <label class="radio-label"><input type="radio" name="modal_qualified" value="false"> 非適格</label>
          </div>
        </div>
        <div class="desk-radio-row">
          <span>税率</span>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="modal_tax_rate" value="10"> 10%</label>
            <label class="radio-label"><input type="radio" name="modal_tax_rate" value="8"> 8%軽減</label>
          </div>
        </div>
        <div class="desk-f">
          <label for="modal-payment-method">取引手段</label>
          <input type="text" id="modal-payment-method" placeholder="現金、事業用カードなど">
        </div>
        <div class="desk-f desk-f-last">
          <label for="modal-memo">摘要</label>
          <input type="text" id="modal-memo" placeholder="任意">
        </div>
      </form>
    </div>

    <!-- 写真は「写真」ボタンで、入力欄の上に重ねて出す（読み込みで入力欄がずれないように） -->
    <div id="modal-image-container" class="desk-modal-photo hidden">
      <div class="desk-modal-photo-frame">
        <button type="button" id="modal-image-btn" class="desk-modal-photo-btn is-loading" aria-label="レシート写真を拡大">
          <img id="modal-image" src="" alt="">
          <span class="desk-modal-photo-status" id="modal-image-status">読み込み中…</span>
          <span class="desk-modal-zoom" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg></span>
        </button>
        <button type="button" id="modal-photo-close" class="desk-modal-photo-close" aria-label="写真をしまう">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <div class="desk-modal-bar">
      <div class="desk-modal-bar-row">
        <button type="button" id="delete-btn" class="desk-btn desk-btn-del">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          削除
        </button>
        <button type="button" id="download-btn" class="desk-btn desk-btn-paper">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          画像
        </button>
        <button type="submit" form="modal-form" class="desk-btn desk-btn-stamp desk-modal-save">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          更新
        </button>
      </div>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/compress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
