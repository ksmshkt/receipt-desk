<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>receipt-desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <span class="logo">
      receipt-desk
      <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="3" rx="1" fill="currentColor" stroke="none"/>
        <line x1="5" y1="9" x2="5" y2="19"/>
        <line x1="19" y1="9" x2="19" y2="19"/>
      </svg>
    </span>
    <div class="header-actions">
      <button id="account-btn" class="btn-ghost account-btn" aria-label="アカウント">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </button>
      <div id="account-menu" class="account-menu hidden">
        <div class="account-usage">
          <p id="account-plan-label"></p>
          <p id="account-usage-label"></p>
        </div>
        <button id="logout-btn" class="btn-ghost">ログアウト</button>
        <button id="delete-account-btn" class="btn-ghost">退会</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="add">追加</button>
    <button class="tab" data-tab="list">一覧</button>
  </nav>

  <!-- 追加タブ -->
  <section id="tab-add" class="tab-content">
    <div class="upload-area" id="image-upload-area">
      <input type="file" id="image-input" accept="image/*" multiple aria-label="レシート画像を撮影または選択">
      <div class="upload-placeholder" id="upload-placeholder">
        <span class="upload-icon">📷</span>
        <p class="upload-hint">タップして撮影 / 写真を選択（複数選択可）</p>
      </div>
    </div>

    <div id="add-toolbar" class="add-toolbar hidden">
      <div class="add-toolbar-row">
        <span id="add-count-label"></span>
        <button type="button" id="add-ocr-btn" class="btn-primary">OCR開始</button>
        <button type="button" id="add-save-btn" class="btn-primary hidden">保存</button>
      </div>
      <div id="bulk-apply-row" class="bulk-apply-row hidden">
        <select id="bulk-apply-field">
          <option value="">一括設定 ▼</option>
          <option value="store_name">店名・取引先</option>
          <option value="category">勘定科目</option>
          <option value="payment_method">取引手段</option>
          <option value="memo">摘要</option>
        </select>
        <select id="bulk-apply-value-select" class="hidden"></select>
        <input type="text" id="bulk-apply-value-text" class="hidden" placeholder="値を入力（空欄で反映も可）">
        <button type="button" id="bulk-apply-btn" class="btn-ghost hidden">反映</button>
      </div>
    </div>

    <div id="add-list"></div>
  </section>

  <!-- 一覧タブ -->
  <section id="tab-list" class="tab-content hidden">
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="店名・メモで検索">
    </div>
    <div class="csv-bar">
      <select id="csv-range-select">
        <option value="all">すべての期間</option>
        <option value="month">今月</option>
        <option value="quarter">今四半期</option>
        <option value="year">今年</option>
        <option value="custom">期間を指定</option>
      </select>
      <input type="date" id="csv-range-start" class="hidden">
      <span id="csv-range-tilde" class="hidden">〜</span>
      <input type="date" id="csv-range-end" class="hidden">
      <button id="export-images-btn" class="btn-ghost">🖼 画像一括DL</button>
      <button id="export-csv-btn" class="btn-ghost">⬇ CSV</button>
      <span id="image-export-progress" class="hidden"></span>
    </div>
    <div id="receipt-list"></div>
    <p id="empty-state" class="empty-state hidden">レシートがありません</p>
  </section>

  <!-- 画像プレビュー -->
  <div id="image-lightbox" class="image-lightbox hidden">
    <img id="lightbox-image" src="" alt="レシート拡大画像">
  </div>

  <!-- 詳細モーダル -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <button id="modal-close" class="btn-ghost">✕ 閉じる</button>
        <div class="modal-actions">
          <button id="download-btn" class="btn-ghost">⬇ 保存</button>
          <button id="delete-btn" class="btn-danger">削除</button>
        </div>
      </div>

      <div id="modal-image-container">
        <img id="modal-image" src="" alt="レシート">
      </div>

      <form id="modal-form" class="receipt-form">
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="modal-date">
        </div>
        <div class="form-group">
          <label>店名・取引先</label>
          <input type="text" id="modal-store">
        </div>
        <div class="form-group">
          <label>金額（円）</label>
          <input type="number" id="modal-amount" min="0">
        </div>
        <div class="form-group">
          <label>適格請求書（インボイス）</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="modal_qualified" value="true"> 適格
            </label>
            <label class="radio-label">
              <input type="radio" name="modal_qualified" value="false"> 非適格
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消費税率</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="modal_tax_rate" value="10"> 10%
            </label>
            <label class="radio-label">
              <input type="radio" name="modal_tax_rate" value="8"> 8%（軽減税率）
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>勘定科目</label>
          <select id="modal-category">
            <option value="">未選択</option>
            <option value="会議費">会議費</option>
            <option value="交通費">交通費</option>
            <option value="消耗品費">消耗品費</option>
            <option value="通信費">通信費</option>
            <option value="接待交際費">接待交際費</option>
            <option value="研修費">研修費</option>
            <option value="広告宣伝費">広告宣伝費</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>取引手段</label>
          <input type="text" id="modal-payment-method" placeholder="例：現金、事業用カード">
        </div>
        <div class="form-group">
          <label>摘要</label>
          <input type="text" id="modal-memo">
        </div>
        <button type="submit" class="btn-primary">更新する</button>
      </form>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/compress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
