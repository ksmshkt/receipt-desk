<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン / 新規登録 | receipt-desk</title>
  <meta name="description" content="receipt-deskのログイン・新規登録ページ。撮りためたレシート・領収書をまとめて読み取り、まとめて記入。画像はZIP、内容はCSVで、どの会計ソフトにも持っていける経費の記録アプリです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="login-page">
  <header class="login-header">
    <a href="/" class="logo" aria-label="receipt-desk トップページへ">
      receipt-desk
      <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="3" rx="1" fill="currentColor" stroke="none"/>
        <line x1="5" y1="9" x2="5" y2="19"/>
        <line x1="19" y1="9" x2="19" y2="19"/>
      </svg>
    </a>
  </header>

  <main class="login-desk">
    <div class="login-wrap">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">ログイン</button>
        <button type="button" class="auth-tab" data-tab="signup">新規登録</button>
      </div>

      <div class="login-pad">
        <form id="auth-form">
          <div class="login-field">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="login-field">
            <label for="password">パスワード</label>
            <input type="password" id="password" required minlength="6" autocomplete="current-password">
          </div>
          <button type="submit" class="login-btn" id="auth-btn">ログイン</button>
        </form>

        <p id="auth-error" class="error-msg hidden" role="alert"></p>

        <p id="plan-info" class="plan-info hidden">
          今は無料プランのみ。AI読み取りは月30件まで使え、上限に達したら翌月にリセットされる。上限を広げる有料プランは準備中。
        </p>
      </div>

      <p class="privacy-notice">
        個人が開発・運営しているサービス。レシート画像はAI企業のAnthropic社に送信され、日付・店名・金額などを読み取る。保存データは日本国内のサーバーで管理し、アカウントを削除するとレシート・画像を含む全データを完全に削除する。詳しくは<a href="privacy.html">プライバシーポリシー</a>へ。
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
